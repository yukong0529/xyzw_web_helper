services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: xyzw-web-helper:latest
    container_name: xyzw-web-helper
    ports:
      - "4173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
